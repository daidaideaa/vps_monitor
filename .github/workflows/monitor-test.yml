name: Monitor tests
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-python@v6
        with:
          python-version: '3.11'
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Install test dependencies
        run: pip install -r observatory/requirements.txt -r vmiss-stock-monitor/requirements.txt
      - name: Parsers, notifications, evidence and legacy compatibility
        run: python -m unittest discover -s tests -p 'test_*.py'
      - name: Linux UDP direction and filter regression
        run: sudo "$(command -v python)" -m unittest discover -s tests -p 'test_udp_metadata.py'
      - name: Legacy offline tests
        run: python -m playwright install --with-deps chromium
      - name: Legacy offline DOM fixtures
        working-directory: vmiss-stock-monitor
        run: python -m pytest -q
      - name: Access, SQL replay, public schema and pages
        run: node --experimental-loader ./tests/html-loader.mjs --test tests/link-gateway.test.mjs tests/gateway.test.mjs tests/frontend.test.cjs tests/public-edge.test.mjs
      - name: Build public allowlisted assets
        run: node scripts/build_public.mjs
