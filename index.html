<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="color-scheme" content="light"><meta name="description" content="VMISS 东京套餐库存状态，由香港 VPS 自动监测。">
<title>VMISS 库存观察</title>
<style>
:root{--ink:#172b3d;--muted:#6d7d89;--line:#dce5eb;--blue:#275ee7;--tone:#8c681c;--tint:#fff5d9;--bg:#f3f6f9}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.6 -apple-system,BlinkMacSystemFont,"Segoe UI","Microsoft YaHei",sans-serif}.wrap{max-width:1000px;margin:auto;padding:34px 24px 30px}header{display:flex;align-items:center;justify-content:space-between;gap:16px;margin-bottom:62px}.brand{font-size:17px;font-weight:750;letter-spacing:.4px}.mark{display:inline-grid;place-items:center;background:var(--ink);color:white;border-radius:10px;width:32px;height:32px;margin-right:10px;font-size:16px}.tag{color:var(--muted);font-size:12px;display:flex;align-items:center;gap:7px}.dot{width:6px;height:6px;border-radius:50%;background:currentColor;display:inline-block}.eyebrow{color:var(--blue);font-size:12px;font-weight:700;letter-spacing:2px}h1{font-size:34px;line-height:1.3;margin:10px 0 12px;letter-spacing:-.8px}.intro{color:var(--muted);margin:0 0 28px}.panel{background:#fff;border:1px solid var(--line);border-radius:20px;box-shadow:0 9px 32px #1d385308;overflow:hidden}.main{display:grid;grid-template-columns:1fr auto;gap:20px;padding:32px 34px}.product{font-size:13px;color:var(--muted);letter-spacing:.3px;margin-bottom:18px}.status{font-size:38px;font-weight:750;line-height:1.25;margin:0 0 12px;letter-spacing:-1px}.explanation{color:var(--muted);font-size:14px;margin:0;max-width:570px}.badge{color:var(--tone);background:var(--tint);border-radius:100px;padding:6px 13px;align-self:start;display:flex;align-items:center;gap:7px;font-size:12px;white-space:nowrap}.facts{display:grid;grid-template-columns:repeat(3,1fr);border-top:1px solid var(--line);padding:24px 34px;gap:24px}.label{color:var(--muted);font-size:12px;margin-bottom:7px}.value{font-size:15px;font-weight:600}.actions{display:flex;align-items:center;gap:12px;margin:24px 0 20px}a.button,button{font:inherit;text-decoration:none;border:1px solid var(--line);padding:10px 19px;border-radius:9px;cursor:pointer;background:white;color:var(--ink);font-size:13px;font-weight:600}.button.primary{background:var(--blue);color:white;border-color:var(--blue)}a:hover,button:hover{filter:brightness(.96)}button:disabled{opacity:.6;cursor:wait}.refresh{margin-left:auto;color:var(--muted);font-size:12px}.note{font-size:12px;color:var(--muted);padding:18px 0;border-top:1px solid var(--line);display:flex;gap:30px;justify-content:space-between}.note p{margin:0;max-width:670px}.note a{color:var(--muted);white-space:nowrap}footer{margin-top:65px;font-size:11px;color:#8b99a3;text-align:center}body[data-state=available]{--tone:#187b53;--tint:#e5f6ed}body[data-state=unknown],body[data-state=stale],body[data-state=offline]{--tone:#a16d13;--tint:#fff3d8}body[data-state=available] .status{color:#15734d}.access{display:inline-flex;align-items:center;gap:7px}.small{font-size:11px;color:var(--muted);margin-top:5px}@media(max-width:650px){.wrap{padding:22px 18px}header{margin-bottom:40px}.tag{font-size:11px}h1{font-size:28px}.main{padding:24px;grid-template-columns:1fr}.badge{grid-row:1;justify-self:start}.status{font-size:34px}.facts{padding:22px 24px;grid-template-columns:1fr;gap:18px}.fact{display:flex;justify-content:space-between;gap:15px}.label{margin:0}.value{text-align:right}.actions{flex-wrap:wrap}.refresh{width:100%;margin:0}.note{display:block}.note a{display:inline-block;margin-top:12px}footer{margin-top:35px}}
</style>
</head>
<body data-state="unknown"><div class="wrap">
<header><div class="brand"><span class="mark">V</span>库存观察</div><div class="tag"><span class="dot"></span>香港 VPS · 自动检查</div></header>
<div class="eyebrow">VMISS / TOKYO</div><h1>东京套餐，现在有货吗？</h1><p class="intro">让服务器持续留意库存，有货时通过邮件提醒。</p>
<main class="panel" aria-live="polite"><div class="main"><div><div id="product" class="product">正在获取监控套餐</div><h2 id="status" class="status">读取状态中…</h2><p id="explanation" class="explanation">正在连接香港 VPS 获取最近一次检查结果。</p></div><div class="badge"><span class="dot"></span><span id="health">连接中</span></div></div>
<div class="facts"><div class="fact"><div class="label">最近检查 · 北京时间</div><div><div id="checked" class="value">—</div><div id="age" class="small"></div></div></div><div class="fact"><div class="label">检查频率</div><div id="interval" class="value">约 3 分钟</div></div><div class="fact"><div class="label">最近确认的库存</div><div id="confirmed" class="value">—</div></div></div></main>
<div class="actions"><a id="buy" class="button primary" href="https://app.vmiss.com/" target="_blank" rel="noopener noreferrer">查看官方套餐 ↗</a><button id="reload" type="button">刷新状态</button><span id="refresh" class="refresh">页面每 30 秒自动更新</span></div>
<div class="note"><p>这里只展示服务器的检查结果。遇到网站验证或连接异常时会明确标注“无法确认”；数据过期后不再显示为当前有货。购买前请在 VMISS 官网确认。</p><a href="https://github.com/daidaideaa/vps_monitor" target="_blank" rel="noopener noreferrer">项目代码 ↗</a></div>
<footer>独立库存监控页面 · 非 VMISS 官方服务 · GitHub Pages</footer></div>
<script>
const API='https://vmiss-status.96-126-179-210.sslip.io/status.json';
const $=id=>document.getElementById(id);let latest=null,next=30,busy=false,networkFailed=false;
const words={available:'有货',unavailable:'无货',unknown:'尚未确认'};
function draw(){
 if(!latest)return;
 const checked=Date.parse(latest.last_checked),seconds=(Date.now()-checked)/1000;
 const interval=Math.max(30,Number(latest.check_interval_seconds)||180);
 const stale=!Number.isFinite(checked)||seconds>Math.max(540,interval*3)||seconds < -120;
 const state=networkFailed?'offline':stale?'stale':latest.status;
 document.body.dataset.state=state;
 $('product').textContent=latest.product_name;
 $('status').textContent=({available:'有货了',unavailable:'暂无库存',unknown:'暂时无法确认',stale:'检查数据已过期',offline:'暂时连接不上'})[state]||'暂时无法确认';
 $('health').textContent=({available:'监控正常',unavailable:'监控正常',unknown:'正在恢复检查',stale:'等待服务器更新',offline:'连接异常'})[state]||'等待检查';
 $('explanation').textContent=state==='offline'?'暂时无法读取服务器状态，保留的记录仅供参考。页面会自动重试。':state==='stale'?'最近的记录已超过有效时间，不能据此判断现在是否有货。':state==='unavailable'?'目标套餐最近一次检查为无货。服务器会继续检查，补货后发送邮件提醒。':state==='available'?'目标套餐已检测到库存，请尽快打开官方页面再次确认。':latest.explanation;
 $('checked').textContent=Number.isFinite(checked)?new Intl.DateTimeFormat('zh-CN',{timeZone:'Asia/Shanghai',month:'2-digit',day:'2-digit',hour:'2-digit',minute:'2-digit',second:'2-digit',hour12:false}).format(checked):'尚无记录';
 $('age').textContent=Number.isFinite(seconds)?(seconds<60?'刚刚检查':Math.floor(Math.max(0,seconds)/60)+' 分钟前'):'';
 $('interval').textContent=interval>=60?'约 '+Math.round(interval/60)+' 分钟':interval+' 秒';
 $('confirmed').textContent=words[latest.last_confirmed]||'尚未确认';
 try{const url=new URL(latest.product_url);if(url.protocol==='https:'&&url.hostname==='app.vmiss.com')$('buy').href=url.href;}catch(e){}
}
async function load(){
 if(busy)return;busy=true;$('reload').disabled=true;
 try{const response=await fetch(API+'?t='+Date.now(),{cache:'no-store',signal:AbortSignal.timeout(12000)});if(!response.ok)throw new Error('HTTP');const data=await response.json();if(data.schema_version!==1||!['available','unavailable','unknown'].includes(data.status))throw new Error('Data');latest=data;networkFailed=false;draw();}
 catch(e){networkFailed=true;if(latest)draw();else{document.body.dataset.state='offline';$('status').textContent='暂时连接不上';$('health').textContent='连接异常';$('explanation').textContent='暂时无法读取服务器状态，页面会自动重试。';}}
 finally{busy=false;$('reload').disabled=false;next=30;}
}
$('reload').addEventListener('click',load);load();setInterval(()=>{if(!busy&&--next<=0)load();$('refresh').textContent=busy?'正在更新…':next+' 秒后自动刷新';draw();},1000);
</script></body></html>
