<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="color-scheme" content="light"><meta name="description" content="东京 VPS 库存观察：四家商户、五个套餐，香港监测，日本备用出口复查。">
<title>东京 VPS 库存观察</title>
<style>
:root{--bg:#f4f3ef;--paper:#fcfbf8;--ink:#292b28;--muted:#787b73;--line:#dedfd7;--accent:#b75c38;--mono:"SFMono-Regular",Consolas,"Liberation Mono",monospace;--green:#39745b}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font:14px/1.6 -apple-system,BlinkMacSystemFont,"Segoe UI","Microsoft YaHei",sans-serif;-webkit-font-smoothing:antialiased}a{color:inherit}.wrap{max-width:1152px;margin:auto;padding:0 36px}header{height:88px;display:flex;align-items:center;justify-content:space-between;border-bottom:1px solid var(--line);gap:16px}.brand{display:flex;align-items:center;gap:11px;text-decoration:none;font-weight:650;font-size:16px;letter-spacing:.5px}.brand-sub{font:11px var(--mono);color:var(--muted);margin-left:5px;letter-spacing:1.4px}.mark{display:flex;align-items:end;gap:3px;height:20px;width:22px}.mark i{width:4px;background:var(--accent);height:12px}.mark i:nth-child(2){height:20px}.mark i:nth-child(3){height:16px}.header-note{font-size:11px;color:var(--muted)}.hero{padding:47px 0 35px;display:flex;justify-content:space-between;align-items:center;gap:20px}.eyebrow{font:10px var(--mono);letter-spacing:1.5px;color:var(--accent)}.eyebrow span{color:var(--muted);margin-left:14px}h1{font-size:37px;line-height:1.35;font-weight:550;letter-spacing:-1.3px;margin:13px 0 10px}.title-dot{color:var(--accent);margin-left:4px}.intro{color:var(--muted);font-size:13px;margin:0}.route{border-left:1px solid var(--line);padding:3px 0 3px 26px}.route>span{color:var(--muted);font-size:10px}.route>div{font:20px var(--mono);margin:9px 0 6px;letter-spacing:1px}.route-line{color:#a5a89f;margin:0 12px}.route small{color:var(--muted);font-size:10px}.toolbar{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:16px}.overview{display:flex;align-items:center;gap:18px;font-size:11px;color:var(--muted)}.overview b{color:var(--ink);font:14px var(--mono);margin-right:4px}.overview .count-live b{color:var(--green)}.summary-total{padding-right:18px;border-right:1px solid var(--line)}.actions{display:flex;align-items:center;gap:16px}.refresh{font:10px var(--mono);color:var(--muted)}button{font-family:inherit;font-size:11px;background:transparent;color:var(--ink);border:1px solid #d5d7ce;border-radius:4px;padding:6px 12px;cursor:pointer}button span{font-size:16px;margin-right:5px}button:hover{background:#e9e9e2}button:disabled{opacity:.5;cursor:wait}a:focus-visible,button:focus-visible{outline:2px solid var(--accent);outline-offset:4px}
.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:18px}.panel{--tone:#77786d;--tint:#eeeee7;background:var(--paper);border:1px solid var(--line);border-radius:8px;overflow:hidden;display:flex;flex-direction:column;min-width:0}.panel[data-state=available],.plan[data-state=available]{--tone:#39745b;--tint:#e9f1eb}.panel[data-state=unknown],.panel[data-state=stale],.panel[data-state=offline],.plan[data-state=unknown],.plan[data-state=stale],.plan[data-state=offline]{--tone:#a0712c;--tint:#f6efdf}.panel-head{display:flex;align-items:center;justify-content:space-between;padding:20px 24px 16px;gap:16px}.provider{margin:0;font-size:19px;font-weight:650;letter-spacing:-.5px}.provider-index{font:10px var(--mono);color:#979b90;letter-spacing:1px}.provider-index span{color:#b9bcb2;margin-right:9px}.main{padding:0 24px}.product{font:12px/1.5 var(--mono);color:var(--muted);overflow-wrap:anywhere}.status-row{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-top:24px}.status{font-size:27px;font-weight:500;letter-spacing:-.7px;line-height:1.3;margin:0}.panel[data-state=available] .status{color:var(--green)}.badge{font-size:10px;color:var(--tone);background:var(--tint);border-radius:3px;padding:4px 8px;display:flex;align-items:center;gap:6px;white-space:nowrap}.dot{display:inline-block;width:5px;height:5px;background:currentColor;border-radius:50%}.explanation{font-size:11px;color:var(--muted);line-height:1.7;margin:10px 0 20px;min-height:19px;overflow-wrap:anywhere}.facts{display:grid;grid-template-columns:1fr 1fr;gap:14px 18px;padding:16px 24px 18px;border-top:1px solid var(--line);margin-top:auto}.label{font-size:10px;color:var(--muted);margin-bottom:4px}.value{font:11px/1.6 var(--mono);overflow-wrap:anywhere}.card-action{display:flex;align-items:center;justify-content:space-between;gap:10px;margin:0 24px;padding:12px 0 15px;border-top:1px solid var(--line)}.source{font-size:10px;color:var(--muted)}.source span{font-family:var(--mono);color:var(--ink)}.buy-link{font-size:11px;text-decoration:none;white-space:nowrap}.buy-link span{display:inline-block;color:var(--accent);margin-left:9px}.buy-link:hover{color:var(--accent)}.group-title{padding:0 24px 15px;color:var(--muted);font:12px var(--mono)}.plans{display:flex;flex-direction:column;flex:1}.plan{--tone:#77786d;--tint:#eeeee7;margin:0 24px;padding:17px 0;flex:1;border-top:1px solid var(--line);min-width:0}.plan-top{display:flex;justify-content:space-between;align-items:center;gap:12px}.plan h3{margin:0;font:15px var(--mono);font-weight:500}.plan-status{display:flex;align-items:center;gap:7px;color:var(--tone);font-size:12px}.plan-meta{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-top:14px}.plan .card-action{margin:12px 0 0;padding:0;border:0}.plan-details{font-size:10px;color:var(--muted);margin-top:9px}.plan-details summary{cursor:pointer;width:fit-content}.plan-details[open]{padding-bottom:8px}.plan-note{font-size:10px;color:var(--muted);margin:8px 0 0;overflow-wrap:anywhere}.plan[data-state=unavailable] .plan-note,.plan[data-state=available] .plan-note{display:none}.note{padding:22px 0 25px;font-size:10px;color:var(--muted)}.note p{margin:0 0 5px}.note p:last-child{padding-left:22px}.note-mark{display:inline-flex;width:12px;height:12px;border:1px solid #b2b5aa;border-radius:50%;align-items:center;justify-content:center;font:9px var(--mono);margin-right:10px}footer{padding:18px 0 26px;border-top:1px solid var(--line);display:flex;justify-content:space-between;gap:20px;font-size:10px;color:var(--muted)}footer a{text-decoration:none}.empty{grid-column:1/-1;padding:35px;border:1px solid var(--line);border-radius:8px;color:var(--muted)}
@media(min-width:761px){.panel{min-height:354px}}@media(max-width:760px){.wrap{padding:0 22px}header{height:72px}.hero{padding:32px 0 28px}h1{font-size:30px}.route{display:none}.grid{grid-template-columns:1fr;gap:14px}.header-note{font-size:10px}.brand-sub{display:none}.toolbar{align-items:center}.overview{gap:12px}.summary-total{padding-right:12px}.refresh{display:none}.panel-head{padding-top:18px}.panel{min-height:0}.eyebrow{font-size:9px}.intro{font-size:12px}footer{font-size:9px}.note{line-height:1.8}}@media(prefers-reduced-motion:no-preference){button,.buy-link{transition:background .15s,color .15s}}
</style>
</head>
<body><div class="wrap">
<header><a class="brand" href="./" aria-label="库存观察首页"><span class="mark" aria-hidden="true"><i></i><i></i><i></i></span>库存观察<span class="brand-sub">/ TOKYO</span></a><span class="header-note">独立监测 · 到货邮件提醒</span></header>
<section class="hero"><div><div class="eyebrow">INFRASTRUCTURE WATCH <span>— 01 / JP</span></div><h1>东京，库存一览<span class="title-dot">.</span></h1><p class="intro">四家商户，五个套餐。下一次补货，不必一直刷新。</p></div><div class="route"><span>查询线路</span><div>HKG <span class="route-line">→</span> TYO</div><small>香港主查询 / 日本备用</small></div></section>
<div class="toolbar"><div id="overview" class="overview" role="status">正在读取库存</div><div class="actions"><span id="refresh" class="refresh">每 30 秒更新</span><button id="reload" type="button"><span aria-hidden="true">↻</span> 刷新</button></div></div>
<main id="cards" class="grid" aria-label="商户库存"><div class="empty">正在读取最近一次检查结果。</div></main>
<div class="note"><p><span class="note-mark">i</span>随机 8～12 分钟检查 · 香港无法确认时经日本复查 · 确认补货后发送邮件</p><p>无货计时包含未确认时段。验证受阻或记录过期时，不推定当前库存。</p></div>
<footer><span>独立监测，非商户官方服务。下单前请以官网库存为准。</span><a href="https://github.com/daidaideaa/vps_monitor" target="_blank" rel="noopener noreferrer">GitHub <span aria-hidden="true">↗</span></a></footer></div>
<script>
// 四家都由香港 VPS 查询，页面刷新只读取已有结果。
const VPS_API='https://vmiss-status.96-126-179-210.sslip.io/status.json';
const cards=document.getElementById('cards'),reload=document.getElementById('reload'),refresh=document.getElementById('refresh');
const allowedHosts=new Set(['app.vmiss.com','clients.zgovps.com','my.rfchost.com','vps.hosting']);
const words={available:'有货',unavailable:'无货',unknown:'尚未确认'};
const targets=[
 {id:'vmiss-jp-tky-tri-basic',provider:'VMISS',source:'vps',product_name:'JP.TKY.TRI.Basic',product_url:'https://app.vmiss.com/store/jp-tokyo-tri'},
 {id:'zgocloud-tokyo-intel-starter',provider:'ZgoCloud',source:'vps',product_name:'Tokyo Intel VPS · Starter',product_url:'https://clients.zgovps.com/index.php?/cart/tokyo-intel-vps/'},
 {id:'rfchost-jp2-co-micro-lite',provider:'RFCHOST',source:'vps',product_name:'JP2-CO-Micro-Lite',product_url:'https://my.rfchost.com/index.php?currency=8&rp=/store/jp-2-china-optimization-network-lite'},
 {id:'vps-tokyo-cloud-starter',provider:'V.PS',source:'vps',product_name:'Tokyo Cloud KVM · Starter',product_url:'https://vps.hosting/?action=add&cmd=cart&id=148'},
 {id:'vps-tokyo-cloud-essential',provider:'V.PS',source:'vps',product_name:'Tokyo Cloud KVM · Essential',product_url:'https://vps.hosting/?action=add&cmd=cart&id=149'}
];
let latest=targets.map(target=>({...target,status:'unknown',last_confirmed:'unknown',last_checked:null,stock:null,check_interval_seconds:600,pending:true})),next=30,busy=false;
function normalize(data,source){
 if(data&&[1,2].includes(data.schema_version)&&Array.isArray(data.products))return data.products;
 if(source==='vps'&&data&&data.schema_version===1&&!data.products&&(!data.provider||data.provider==='VMISS'))return [{...data,id:'vmiss-jp-tky-tri-basic',provider:'VMISS'}];
 throw new Error('Data');
}
function mergeSource(source,products,failed=false){
 latest=latest.map((old,index)=>{
  const target=targets[index];if(target.source!==source)return old;
  if(failed)return {...old,pending:false,sourceFailed:true};
  const matches=products.filter(item=>item&&item.provider===target.provider&&item.id===target.id);
  if(matches.length!==1)return {...old,pending:false,sourceFailed:true};
  const item=matches[0],status=Object.hasOwn(words,item.status)&&!(Number(item.unknown_count)>0)?item.status:'unknown';
  return {...item,...target,product_name:target.provider==='VMISS'?(item.product_name||target.product_name):target.product_name,
   product_url:target.provider==='VMISS'?(item.product_url||target.product_url):target.product_url,
   status,last_confirmed:Object.hasOwn(words,item.last_confirmed)?item.last_confirmed:'unknown',
   stock:status==='unknown'?null:item.stock,sourceFailed:false,pending:false};
 });
}
function productState(item){
 const checked=Date.parse(item.last_checked),seconds=(Date.now()-checked)/1000;
 const supplied=Number(item.check_interval_seconds),interval=Number.isFinite(supplied)&&supplied>=30?supplied:600;
 const stale=!Number.isFinite(checked)||seconds>interval*3||seconds < -120;
 const awaitingFirst=item.last_checked===null&&item.status==='unknown'&&item.last_confirmed==='unknown'&&item.unknown_count===0;
 const state=item.sourceFailed?'offline':item.pending||awaitingFirst?'unknown':stale?'stale':item.status;
 return {state,checked,seconds,interval};
}
function safeLink(value){try{const url=new URL(value);return url.protocol==='https:'&&allowedHosts.has(url.hostname)?url.href:'#';}catch(e){return '#';}}
function inventoryHistory(item,state){
 const since=Date.parse(item.unavailable_since),checked=Date.parse(item.last_checked),last=Date.parse(item.last_available_at);
 let duration=({available:'当前有货',unknown:'暂时无法确认',stale:'检查数据已过期',offline:'连接异常'})[state]||'尚无记录';
 if(state!=='available'&&Number.isFinite(since)&&since<=checked&&checked<=Date.now()+120000){
  const minutes=Math.floor(Math.max(0,Date.now()-since)/60000),days=Math.floor(minutes/1440),hours=Math.floor(minutes%1440/60);
  duration=minutes<1?'不足 1 分钟':(days?days+' 天 ':'')+(hours?hours+' 小时 ':'')+(minutes%60?minutes%60+' 分钟':'');
 }
 const lastAvailable=Number.isFinite(last)&&last<=Date.now()+120000?new Intl.DateTimeFormat('zh-CN',{timeZone:'Asia/Shanghai',year:'numeric',month:'2-digit',day:'2-digit',hour:'2-digit',minute:'2-digit',hour12:false}).format(last):'尚无记录';
 return [['本轮无货 · 含未确认时段',duration.trim()+(['unknown','stale','offline'].includes(state)&&Number.isFinite(since)?'（当前待确认）':'')],['上次确认有货 · 北京时间',lastAvailable]];
}
function el(tag,className,text){const node=document.createElement(tag);node.className=className;if(text!==undefined)node.textContent=text;return node;}
const statusLabels={available:'有货了',unavailable:'暂无库存',unknown:'暂时无法确认',stale:'记录已过期',offline:'连接异常'};
const openHistory=new Set();
function stockLabel(item,state){return ['available','unavailable'].includes(state)&&Number.isInteger(item.stock)&&item.stock>=0?'库存 '+item.stock:null;}
function checkedTime(meta){return Number.isFinite(meta.checked)?new Intl.DateTimeFormat('zh-CN',{timeZone:'Asia/Shanghai',month:'2-digit',day:'2-digit',hour:'2-digit',minute:'2-digit',second:'2-digit',hour12:false}).format(meta.checked):'等待首次检查';}
function explanationFor(item,state){return state==='offline'?'暂时无法读取服务器状态，页面将自动重试。':state==='stale'?'最近记录已过期，等待下一次可靠检查。':state==='available'?'已检测到库存，请前往官网确认并下单。':state==='unavailable'?'最近一次可靠检查未发现库存。':(item.explanation||'本轮无法可靠确认库存，等待复查。');}
function fact(label,value){const node=el('div','fact');node.append(el('div','label',label),el('div','value',value));return node;}
function actionFor(item){const action=el('div','card-action'),source=el('span','source','本轮出口 ');source.append(el('span','',item.query_location==='japan-vps-egress'?'TYO · 日本备用':'HKG · 香港'));const link=el('a','buy-link','官方套餐');link.href=safeLink(item.product_url);link.target='_blank';link.rel='noopener noreferrer';link.append(el('span','','↗'));action.append(source,link);return action;}
function panelHead(provider,index){const head=el('div','panel-head'),number=el('span','provider-index');number.append(el('span','','JP /'),el('span','',index));head.append(el('h2','provider',provider),number);return head;}
function cardFor(item,index){
 const meta=productState(item),state=meta.state,panel=el('article','panel');panel.dataset.state=state;panel.dataset.productId=item.id;
 panel.append(panelHead(item.provider,String(index+1).padStart(2,'0')));
 const main=el('div','main'),row=el('div','status-row'),badge=el('span','badge');badge.append(el('span','dot'),el('span','',stockLabel(item,state)||({available:'已确认',unavailable:'已确认',unknown:'待复查',stale:'待更新',offline:'连接异常'})[state]));
 row.append(el('h3','status',statusLabels[state]),badge);main.append(el('div','product',item.product_name),row,el('p','explanation',explanationFor(item,state)));
 const facts=el('div','facts'),history=inventoryHistory(item,state);facts.append(fact('最近检查 · 北京时间',checkedTime(meta)),fact('最近确认',words[item.last_confirmed]||'尚未确认'),fact('本轮无货 · 含未确认时段',history[0][1]),fact('上次有货 · 北京时间',history[1][1]));
 panel.append(main,facts,actionFor(item));return panel;
}
function groupedCard(items){
 const panel=el('article','panel grouped');panel.dataset.state='group';panel.append(panelHead('V.PS','04'),el('div','group-title','Tokyo Cloud KVM'));
 const plans=el('div','plans');
 items.forEach(item=>{const meta=productState(item),state=meta.state,plan=el('section','plan');plan.dataset.state=state;plan.dataset.productId=item.id;
  const top=el('div','plan-top'),status=el('span','plan-status');status.append(el('span','dot'),el('span','',statusLabels[state]));top.append(el('h3','',item.id==='vps-tokyo-cloud-starter'?'Starter':'Essential'),status);
  const info=el('div','plan-meta'),history=inventoryHistory(item,state);info.append(fact('最近检查 · 北京时间',checkedTime(meta)),fact('本轮无货 · 含未确认时段',history[0][1]));
  const details=el('details','plan-details'),summary=el('summary','','历史记录'),detailFacts=el('div','plan-meta');detailFacts.append(fact('最近确认',words[item.last_confirmed]||'尚未确认'),fact('上次有货 · 北京时间',history[1][1]));details.append(summary,detailFacts);
  if(stockLabel(item,state))detailFacts.append(fact('商家库存数字',String(item.stock)));
  details.open=openHistory.has(item.id);details.addEventListener('toggle',()=>{if(details.open)openHistory.add(item.id);else openHistory.delete(item.id);});
  plan.append(top,el('p','plan-note',explanationFor(item,state)),info,details,actionFor(item));plans.append(plan);
 });panel.append(plans);return panel;
}
function draw(){
 if(!latest)return;
 cards.replaceChildren(...latest.slice(0,3).map(cardFor),groupedCard(latest.slice(3)));
 const count=state=>latest.filter(item=>productState(item).state===state).length,available=count('available'),unavailable=count('unavailable'),unknown=latest.length-available-unavailable,overview=document.getElementById('overview');
 const stat=(className,value,label)=>{const node=el('span',className);node.append(el('b','',String(value)),el('span','',label));return node;};
 overview.replaceChildren(stat('summary-total',5,'套餐'),stat('count-live',available,'有货'),stat('',unavailable,'无货'),stat('',unknown,'待确认'));
}
async function loadSource(source,url){
 if(!url){latest=latest.map(item=>item.source===source?{...item,pending:true,explanation:'库存检查尚未启用'}:item);draw();return;}
 try{
  const response=await fetch(url,{cache:'no-store',signal:AbortSignal.timeout(12000)});
  if(!response.ok)throw new Error('HTTP');
  mergeSource(source,normalize(await response.json(),source));
 }catch(e){mergeSource(source,[],true);}
 draw();
}
async function load(){
 if(busy)return;busy=true;reload.disabled=true;
 try{await loadSource('vps',VPS_API);}
 finally{busy=false;reload.disabled=false;next=30;}
}
draw();
reload.addEventListener('click',load);load();setInterval(()=>{if(!busy&&--next<=0)load();refresh.textContent=busy?'正在更新…':next+' 秒后更新';},1000);
</script></body></html>
