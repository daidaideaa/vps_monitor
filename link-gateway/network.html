<!doctype html><html lang="zh-CN"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>链路与故障记录 · VPS Monitor</title>
<style>
:root{color-scheme:dark;font-family:system-ui,"Microsoft YaHei",sans-serif;background:#10151c;color:#e4ebf2}body{max-width:1200px;margin:auto;padding:28px}nav{display:flex;gap:22px;align-items:center}a{color:#8adfc4}header{margin:40px 0 24px}h1{font-size:32px;margin-bottom:12px}h2{font-size:20px}p,small{color:#aab9c7;line-height:1.7}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(300px,1fr));gap:18px}.card,article{border:1px solid #2f4050;border-radius:14px;background:#17212c;padding:20px;margin:14px 0}.badge{font-size:13px;padding:5px 8px;border-radius:5px;background:#293b4c}.ok{color:#83e0ac}.fail{color:#ff9a93}.unknown{color:#f3ce7f}table{width:100%;border-collapse:collapse;font-size:13px}td,th{text-align:left;padding:9px 3px;border-bottom:1px solid #2f4050}td:last-child{text-align:right}pre{white-space:pre-wrap;overflow-wrap:anywhere;color:#bccbd7;font-size:12px}svg{width:100%;height:150px;background:#101820;border-radius:6px}button,select{background:#21374a;color:inherit;border:1px solid #4c6378;border-radius:6px;padding:8px}#error{color:#ffbc81}section{scroll-margin-top:20px}.legend{font-size:12px}.facts{white-space:pre-wrap;line-height:1.8}footer{margin:40px 0;font-size:12px;color:#8094a7}
</style><nav><strong>VPS Monitor</strong><a href="https://daidaideaa.github.io/vps_monitor/">库存</a><a href="#links">链路</a><a href="#incidents">故障记录</a><a id="komari" hidden target="_blank" rel="noreferrer">Komari 管理 ↗</a></nav>
<header><span class="badge">私有 · 北京时间</span><h1>链路与故障记录</h1><p>Windows、VMISS、日本家宽分别上报。采样缺失不计入丢包；独立 HY2 探针与 Clash Party 当前会话分开记录。</p><p id="sync">正在读取…</p><p id="error" role="alert"></p></header>
<section id="links"><h2>当前观测</h2><div id="probes" class="grid"></div><h2>延迟与失败率 <select id="range"><option value="3600">最近 1 小时</option><option value="86400">最近 24 小时</option><option value="604800">最近 7 天</option><option value="2592000">最近 30 天</option></select></h2><p>曲线为分钟平均成功耗时；失败率只统计实际执行的探测。断线与数据缺口不会绘成 0 ms。</p><div id="charts" class="grid"></div></section>
<section id="incidents"><h2>故障时间线</h2><div id="events"></div></section>
<footer>网络/资源通常每 5 秒、HY2 每 15 秒采集；页面每 5 秒读取。原始数据 7 天，分钟汇总及故障证据 30 天；容量不足时会提前裁剪并记录。网页不可达时可使用桌面的“记录网络故障”快捷方式。</footer>
<script>
const $=s=>document.querySelector(s), names={windows:'Windows 本机',vmiss:'VMISS 日本',home:'日本家宽'}, fmt=t=>t?new Intl.DateTimeFormat('zh-CN',{timeZone:'Asia/Shanghai',month:'2-digit',day:'2-digit',hour:'2-digit',minute:'2-digit',second:'2-digit',hour12:false}).format(t*1000):'尚无记录';
function node(tag,text,cls){const e=document.createElement(tag);if(text!==undefined)e.textContent=text;if(cls)e.className=cls;return e;}
async function get(path){const r=await fetch('/network/api/'+path,{cache:'no-store',signal:AbortSignal.timeout(10000)});if(r.status===401){throw Error('登录已过期或 Access 尚未配置，请重新登录。');}if(!r.ok)throw Error('读取失败 HTTP '+r.status);return r.json();}
function renderProbe(p,now){const e=node('article'),s=p.sample,age=s?Math.max(0,now-s.captured_at):null;const state=!s?'等待首次上报':age>60?'探针失联 / 数据过期':s.upload?.last_error?'上传曾失败，正在补传':'观测在线';e.append(node('h2',names[p.source]),node('span',state,'badge '+(age!==null&&age<=60?'ok':'unknown')));
if(!s){e.append(node('p','尚无样本，不能据此判断链路是否断线。'));return e;}
e.append(node('p','采样 '+fmt(s.captured_at)+' · 数据年龄 '+Math.round(age)+' 秒'));
if(s.client?.profile)e.append(node('p','实际客户端：'+s.client.profile+' · '+Object.entries(s.client.groups||{}).filter(([k])=>k==='Proxies'||k==='GLOBAL').map(([k,v])=>k+' → '+v).join(' / ')+' · TUN '+(s.client.tun?.enable?'开':'关')));
if(s.gap)e.append(node('p','采集曾中断 '+s.gap.seconds+' 秒：可能休眠或探针暂停，待事件记录确认。','unknown'));
if(s.retention_warning||p.retention_warnings?.length)e.append(node('p','存储达到容量上限，部分旧证据已裁剪。','unknown'));
const table=node('table');for(const [k,c] of Object.entries(s.checks||{})){const r=node('tr');r.append(node('td',k+' · '+(c.sampled_at?Math.max(0,Math.round(now-c.sampled_at))+' 秒前':'时间待确认')),node('td',c.state==='ok'?(Number.isFinite(c.ms)?c.ms.toFixed(1)+' ms':'正常'):c.state==='fail'?'探测失败':c.reason||'未采样',c.state));table.append(r);}e.append(table);
const d=node('details');d.append(node('summary','客户端、主机与上传状态'),node('pre',JSON.stringify({client:s.client,host:s.host,network:s.network,clock:s.clock,upload:s.upload,gap:s.gap},null,2)));e.append(d);return e;}
function renderIncident(i){const e=node('article');e.append(node('h3',fmt(i.started_at)+' · '+names[i.source]+' · '+i.target),node('p',i.recovered_at?'恢复于 '+fmt(i.recovered_at):'记录状态：'+i.status));const r=i.report||{};for(const [k,label] of [['facts','已确认事实'],['inferences','推断'],['missing','缺失证据']]){e.append(node('strong',label),node('p',(r[k]||['待定位']).join('\n'),'facts'));}const a=node('a','下载证据 JSON');a.href='/network/api/evidence?source='+encodeURIComponent(i.source)+'&id='+encodeURIComponent(i.id);e.append(a);return e;}
function chart(source,metric,rows,bucket=60){const card=node('article');card.append(node('h3',names[source]+' · '+metric));const n=rows.reduce((a,r)=>a+r.n,0),failed=rows.reduce((a,r)=>a+r.failed,0);card.append(node('p',n+' 次探测 · '+(n?(failed/n*100).toFixed(1):'—')+'% 失败','legend'));const good=rows.filter(r=>r.n>r.failed), svg=document.createElementNS('http://www.w3.org/2000/svg','svg');svg.setAttribute('viewBox','0 0 500 150');svg.setAttribute('role','img');svg.setAttribute('aria-label',metric+' 分钟延迟曲线');
if(good.length){const start=rows[0].minute,end=rows.at(-1).minute,max=Math.max(1,...good.map(r=>r.total/(r.n-r.failed)));let segment=[];const draw=()=>{if(!segment.length)return;const p=document.createElementNS(svg.namespaceURI,'polyline');p.setAttribute('points',segment.join(' '));p.setAttribute('fill','none');p.setAttribute('stroke','#83e0bd');p.setAttribute('stroke-width','2');svg.append(p);segment=[];};let prev=null;for(const r of rows){if(r.n===r.failed||prev!==null&&r.minute-prev>bucket*1.5)draw();if(r.n>r.failed)segment.push((10+480*(r.minute-start)/Math.max(60,end-start))+','+(135-120*(r.total/(r.n-r.failed))/max));prev=r.minute;}draw();card.append(node('small','纵轴 0～'+max.toFixed(0)+' ms · '+fmt(start)+' — '+fmt(end)));}card.append(svg);return card;}
let busy=false,lastHistory=0;async function refresh(){if(busy)return;busy=true;try{const [latest,incidents]=await Promise.all([get('latest'),get('incidents')]);$('#probes').replaceChildren(...latest.probes.map(p=>renderProbe(p,latest.server_at)));$('#events').replaceChildren(...(incidents.incidents.length?incidents.incidents.map(renderIncident):[node('p','暂无故障记录。首次失败即留证据，连续 3 次失败才主动告警。')]));if(latest.komari_url&&new URL(latest.komari_url).protocol==='https:'){$('#komari').href=latest.komari_url;$('#komari').hidden=false;}if(Date.now()-lastHistory>60000){const duration=Number($('#range').value),all=await Promise.all(Object.keys(names).map(async source=>({source,...await get('history?source='+source+'&start='+(Date.now()/1000-duration))})));const cards=[];for(const g of all){const metrics=[...new Set(g.minutes.map(r=>r.metric))];for(const metric of metrics)cards.push(chart(g.source,metric,g.minutes.filter(r=>r.metric===metric),g.bucket_seconds));}$('#charts').replaceChildren(...(cards.length?cards:[node('p','等待积累分钟数据。')]));lastHistory=Date.now();}$('#sync').textContent='最近同步 '+fmt(latest.server_at);$('#error').textContent='';}catch(e){$('#error').textContent=e.message+' 保留画面仅供参考。';}finally{busy=false;}}
$('#range').addEventListener('change',()=>{lastHistory=0;refresh();});refresh();setInterval(refresh,5000);
</script></html>
